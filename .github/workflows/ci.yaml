name: CI - Task Manager API
on: [push, pull_request]
jobs:
  test:
    runs-on:ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: task_manager_test
          MYSQL_USER: app
          MYSQL_PASSWORD: app_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
        DATABASE_URL: mysql+pymysql://app:app_ci@127.0.0.1:3306/task_manager_test

    steps:

      # Download the code form the repository
      - name: Download code
        uses: actions/checkout@v3 

      - name: Prepare python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Start API and wait for it to be ready
        run: |
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for intento in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json > /dev/null; then
              echo "API disponible"
              exit 0
            fi
            sleep 2
          done
          echo "La API no ha arrancado"
          cat api.log
          exit 1

      - name: Run api tests
        run: python tests/test_python.py --base-url http://127.0.0.1:8000

      -name: Show logs if tests fail
        if: failure()
        run: cat api.log 2>/dev/null || true